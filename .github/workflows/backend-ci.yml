name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: test_aerolinea
          POSTGRES_USER: aerolinea
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerolinea -d test_aerolinea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgresql://aerolinea:ci-only-password@localhost:5432/test_aerolinea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/development.txt
          python -m pip check
      - name: Check Django configuration
        run: |
          python manage.py check
      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrate empty PostgreSQL database and detect model drift
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70
      - name: Validate OpenAPI
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
